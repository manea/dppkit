services:
  dppkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dppkit
    restart: unless-stopped
    ports:
      - "127.0.0.1:4201:4201"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4201
      DPPKIT_DATA_DIR: /app/data
      BASE_PATH: ${BASE_PATH:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - dppkit_data:/app/data

volumes:
  dppkit_data:
